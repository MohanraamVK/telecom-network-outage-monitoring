spring.application.name=network-monitor

# Hosting platforms such as Render tell the app which port to use via PORT
server.port=${PORT:8080}

# Optional, git-ignored file with local overrides (DB_PASSWORD=..., JWT_SECRET=...)
spring.config.import=optional:file:./.env[.properties]

# ---------------------------------------------------------------------------
# Database
# Every value can be overridden with an environment variable, so no real
# credentials need to live in this file. See ../../.env.example.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/telecomdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
# Recycle connections before serverless databases (e.g. TiDB Cloud) drop idle ones
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:300000}
spring.datasource.hikari.keepalive-time=60000

# Schema is managed by Flyway (src/main/resources/db/migration), not Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Flyway runs on MySQL and H2. TiDB Cloud rejects Flyway's history-table setup, so
# TiDB deployments set FLYWAY_ENABLED=false and JPA_DDL_AUTO=update (see render.yaml).
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
# HS256 needs a secret of at least 32 characters. Always override in real use:
#   openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Comma-separated list of origins allowed to call the API from a browser
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Account created on first start-up if it does not exist yet
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Optional read-only account for a public demo (role VIEWER: GET requests only)
app.demo.enabled=${DEMO_ENABLED:false}
app.demo.username=${DEMO_USERNAME:demo}
app.demo.password=${DEMO_PASSWORD:demo123}

# ---------------------------------------------------------------------------
# Live monitoring
# ---------------------------------------------------------------------------
app.monitor.enabled=${MONITOR_ENABLED:true}
app.monitor.interval=${MONITOR_INTERVAL:10s}
app.monitor.heartbeat-timeout=${MONITOR_HEARTBEAT_TIMEOUT:30s}
# Fake heartbeats for the demo; set false when real agents POST heartbeats
app.monitor.simulator-enabled=${SIMULATOR_ENABLED:true}
# Chance per check that a healthy simulated node starts an outage
app.monitor.failure-probability=${SIMULATOR_FAILURE_PROBABILITY:0.002}
app.monitor.min-outage=1m
app.monitor.max-outage=4m

# Fill an empty database with demo nodes and incident history
app.seed.demo-data=${SEED_DEMO_DATA:true}

# ---------------------------------------------------------------------------
# API docs (public): http://localhost:8080/swagger-ui.html
# ---------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
