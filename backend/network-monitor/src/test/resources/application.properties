# Test configuration: in-memory H2 so `mvnw test` and CI need no MySQL server.
spring.datasource.url=jdbc:h2:mem:telecomdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Flyway builds the schema, exactly as in production
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

app.jwt.secret=test-secret-test-secret-test-secret-test-secret
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration=7d
app.cors.allowed-origins=http://localhost:5173
app.admin.username=admin
app.admin.password=admin123

# No background monitoring in tests; seed data exercises the migrations
app.monitor.enabled=false
app.seed.demo-data=true

# Open SSE streams would otherwise hold up graceful shutdown between test classes
server.shutdown=immediate
