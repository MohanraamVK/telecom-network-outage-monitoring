# One-command local stack:  docker compose up --build
#   Frontend  http://localhost:5173
#   API       http://localhost:8080   (Swagger UI: /swagger-ui.html)
#   MySQL     localhost:3307
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: telecomdb
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-telecom}
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-telecom}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend/network-monitor
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/telecomdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-telecom}
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-change-me-docker-dev-secret}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
        VITE_SHOW_DEMO_CREDENTIALS: "true"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db-data:
